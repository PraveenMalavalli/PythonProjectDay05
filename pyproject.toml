[project]
name = "day5-ollama-extractor"
version = "1.0.0"
description = "Offline-testable Ollama LLM client, CV extraction, vision invoice extraction, and model evaluation"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyMuPDF>=1.24,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.7", "pyright>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "basic"
